# Builds the signed release APK.
# - Tag push (`git tag v1.0.0 && git push origin v1.0.0`, must match app.json's
#   version): attaches the APK to a draft GitHub Release. Review it, then publish.
# - Manual run (Actions → Release APK → Run workflow): test build only. The APK
#   is uploaded as a run artifact (kept 14 days); no tag, no release. It is
#   signed with the same key, so a later release installs over it.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   KODO_KEYSTORE_BASE64   base64 of the release keystore (`base64 -w0 kodo-release.keystore`)
#   KODO_KEYSTORE_PASSWORD keystore password
#   KODO_KEY_ALIAS         key alias
#   KODO_KEY_PASSWORD      key password

name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Resolve version
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match app.json version $VERSION"
              exit 1
            fi
          else
            VERSION="$VERSION-test.${GITHUB_SHA::7}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

      # Dependency downloads, the Gradle distribution and the build cache
      # (--build-cache in build:apk). Only caches/ and wrapper/: never
      # ~/.gradle/gradle.properties, which holds the signing secrets.
      # Native (CMake) builds are not cacheable and still run every time.
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            gradle-${{ hashFiles('package-lock.json') }}-
            gradle-

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KODO_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KODO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KODO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KODO_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KODO_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/kodo-release.keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          mkdir -p ~/.gradle
          {
            echo "KODO_UPLOAD_STORE_FILE=$KEYSTORE"
            echo "KODO_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD"
            echo "KODO_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "KODO_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
          } >> ~/.gradle/gradle.properties

      - name: Build APK
        run: npm run build:apk

      - name: Rename, checksum and verify
        run: |
          OUT=android/app/build/outputs/apk/release
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          APKSIGNER="${BUILD_TOOLS}apksigner"
          AAPT2="${BUILD_TOOLS}aapt2"
          mkdir dist
          # Universal APK keeps the plain name; per-ABI APKs get the ABI suffix.
          mv "$OUT/app-universal-release.apk" "dist/kodo-v$VERSION.apk"
          for f in "$OUT"/app-*-release.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            mv "$f" "dist/kodo-v$VERSION-$abi.apk"
          done
          cp android/app/build/outputs/mapping/release/mapping.txt "dist/kodo-v$VERSION-r8-mapping.txt"
          cd dist
          echo "| APK | Size | versionCode |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for apk in *.apk; do
            sha256sum "$apk" > "$apk.sha256"
            "$APKSIGNER" verify --print-certs "$apk" | grep -E 'DN|SHA-256'
            size=$(stat -c %s "$apk")
            code=$("$AAPT2" dump badging "$apk" | sed -nE "1s/.*versionCode='([0-9]+)'.*/\1/p")
            echo "$apk: $size bytes, versionCode $code"
            echo "| $apk | $((size / 1048576)) MB | $code |" >> "$GITHUB_STEP_SUMMARY"
            # IzzyOnDroid works with about 30 MB per APK.
            if [ "$apk" != "kodo-v$VERSION.apk" ] && [ "$size" -gt 31457280 ]; then
              echo "::warning::$apk is over 30 MB, above IzzyOnDroid's usual limit"
            fi
          done
          ls -l

      - name: Upload test APK
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: kodo-v${{ env.VERSION }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error

      - name: Draft GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: dist/*

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/kodo-release.keystore" ~/.gradle/gradle.properties
